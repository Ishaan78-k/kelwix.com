<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<title>Owner Panel | Hemchand Agrawal</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#190b0e;color:#f4eee8;min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:40px 20px}
h1{font-weight:500;font-size:28px;margin:0 0 18px}.box{background:#2b1013;border:1px solid rgba(255,243,224,.2);padding:24px;margin-bottom:24px}
input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;background:#190b0e;color:#fff;border:1px solid rgba(255,243,224,.3);font:inherit;box-sizing:border-box}
button{padding:12px 20px;background:#d5aa62;color:#190b0e;border:0;font-weight:700;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-size:12px}button:disabled{opacity:.5}
button.alt{background:transparent;color:#f4eee8;border:1px solid rgba(255,243,224,.4)}.msg{color:#ead1a0;font-size:14px;min-height:20px}
.row{display:flex;gap:14px;align-items:center;border-top:1px solid rgba(255,243,224,.15);padding:10px 0}.row img{width:56px;height:70px;object-fit:cover}.row span{flex:1}.hide{display:none}
</style></head><body><div class="wrap">
<section id="auth" class="box"><h1>Owner login</h1>
<label>Email <input id="email" type="email" autocomplete="username"></label>
<label>Password <input id="pw" type="password" autocomplete="current-password"></label>
<button id="login">Sign in</button><p class="msg" id="auth-msg"></p></section>
<section id="panel" class="hide">
<div style="display:flex;justify-content:space-between;align-items:center"><h1>Owner panel</h1><button class="alt" id="logout">Log out</button></div>
<div class="box">
<label>Type <select id="type"><option value="saree">Saree post</option><option value="offer">Offer</option></select></label>
<label>Title <input id="title" maxlength="80"></label>
<label>Price / discount <input id="price" maxlength="40" placeholder="₹48,500 or 20% OFF"></label>
<label>Badge (offers) <input id="badge" maxlength="20" placeholder="Festive sale"></label>
<label>Valid till (offers, optional) <input id="expires" type="date"></label>
<label>Description <textarea id="desc" rows="3" maxlength="300"></textarea></label>
<label>Photo <input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
<button id="post">Publish</button><p class="msg" id="post-msg"></p></div>
<div class="box"><h1 style="font-size:20px">Published</h1><div id="list"></div></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const IDLE=20*60e3; let idleT;
function bump(){clearTimeout(idleT);idleT=setTimeout(()=>sb.auth.signOut(),IDLE)}
['click','keydown'].forEach(e=>addEventListener(e,bump));
async function isOwner(){const{data,error}=await sb.rpc('is_owner');return !error&&data===true}
async function gate(){
  const{data:{session}}=await sb.auth.getSession();
  if(session&&await isOwner()){$('auth').classList.add('hide');$('panel').classList.remove('hide');bump();list()}
  else{if(session){await sb.auth.signOut();$('auth-msg').textContent='This account is not authorised.'}$('panel').classList.add('hide');$('auth').classList.remove('hide')}
}
$('login').onclick=async()=>{const b=$('login');b.disabled=true;$('auth-msg').textContent='';
  const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});
  $('pw').value='';b.disabled=false;if(error)return $('auth-msg').textContent='Login failed.';gate()};
$('logout').onclick=async()=>{await sb.auth.signOut()};
sb.auth.onAuthStateChange(()=>gate());
function shrink(f){return new Promise((res,rej)=>{
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>10e6)return rej('Use a JPG/PNG/WebP under 10 MB.');
  const im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?res(b):rej('Image error.'),'image/jpeg',.82)};im.onerror=()=>rej('Could not read image.');im.src=URL.createObjectURL(f)})}
$('post').onclick=async()=>{const m=$('post-msg'),btn=$('post');m.textContent='';
  const title=$('title').value.trim();if(!title)return m.textContent='Title is required.';
  btn.disabled=true;try{
    let image_url=null,image_path=null;const f=$('photo').files[0];
    if(f){const blob=await shrink(f);image_path=crypto.randomUUID()+'.jpg';
      const{error:ue}=await sb.storage.from('saree-images').upload(image_path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
      if(ue)throw ue.message;image_url=sb.storage.from('saree-images').getPublicUrl(image_path).data.publicUrl}
    const{error}=await sb.from('posts').insert({type:$('type').value,title,price:$('price').value.trim()||null,badge:$('badge').value.trim()||null,
      description:$('desc').value.trim()||null,expires_at:$('expires').value||null,image_url,image_path});
    if(error)throw error.message;
    ['title','price','badge','desc','photo','expires'].forEach(i=>$(i).value='');m.textContent='Published.';list()
  }catch(e){m.textContent='Failed: '+e}btn.disabled=false};
async function list(){const l=$('list');l.textContent='';
  const{data}=await sb.from('posts').select('*').order('created_at',{ascending:false});
  (data||[]).forEach(it=>{const r=document.createElement('div');r.className='row';
    if(it.image_url){const i=document.createElement('img');i.src=it.image_url;r.appendChild(i)}
    const s=document.createElement('span');s.textContent=`[${it.type}] ${it.title} ${it.price||''}`;
    const d=document.createElement('button');d.className='alt';d.textContent='Delete';
    d.onclick=async()=>{if(!confirm('Delete this post?'))return;
      if(it.image_path)await sb.storage.from('saree-images').remove([it.image_path]);
      await sb.from('posts').delete().eq('id',it.id);list()};
    r.append(s,d);l.appendChild(r)})}
</script></body></html>
